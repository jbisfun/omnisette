[package]
name = "omnisette"
license = "MPL-2.0"
edition = "2024"
version = "0.1.22"
authors = ["JP D'Agostino"]
repository = "https://github.com/jbisfun/omnisette"

[features]
remote-anisette = []
async = ["dep:async-trait"]
default = ["remote-anisette", "dep:remove-async-await"]
remote-anisette-v3 = [
    "async",
    "dep:tokio-tungstenite",
    "dep:futures-util",
]
aos-kit = []

[dependencies]
adi-core = { git = "https://github.com/sacca97/os-findmy-e", rev = "374d83854f657a7fdca45f813387d99d491db0e2" }

libc = "0.2"
async-trait = { version = "0.1", optional = true }
remove-async-await = { version = "1.0", optional = true }
tokio-tungstenite = { version = "0.27.0", optional = true, features = [
    "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3.28", optional = true }
chrono = {version = "0.4", default-features = false, features = ["clock", "serde", "std"]}
anyhow = "1.0"
sha2 = "0.11"
base64 = "0.22"
rand = "0.8"
plist = "1.8"
thiserror = "2.0"
hex = "0.4"
reqwest = {version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
    "gzip",
    "system-proxy",
]}
uuid = {version = "1.3", features = ["v4", "fast-rng", "macro-diagnostics"]}
log = "0.4"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
flate2 = "1.1"

# Android's ADI libraries are loaded as native ELF code, which iOS can't do.
# (Mac CoreADI runs under Unicorn, which works on iOS with an interpreter-only
# (TCI) Unicorn linked through pkg-config.)
[target.'cfg(not(target_os = "ios"))'.dependencies]
android-loader = { git = "https://github.com/Dadoum/android-loader", branch = "bigger_pages" }

[target.'cfg(target_os = "macos")'.dependencies]
dlopen2 = "0.4"
objc = "0.2"
objc-foundation = "0.1"

[dev-dependencies]
tokio = {version = "1.43", features = ["macros", "rt-multi-thread"]}

[[example]]
name = "local_mac"
required-features = ["async"]
